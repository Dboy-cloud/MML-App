.paper table{width:100%;border-collapse:collapse;margin-bottom:8px}.paper th,.paper td{border:1px solid #111;padding:4px 6px;font-size:12px;vertical-align:top}.paper td.am{text-align:right;white-space:nowrap}.paper th{text-align:center}
.paper .tots{margin-left:auto;width:min(260px,100%)}.paper .tots div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}.paper .tots .t{font-weight:700;border-top:1px solid #111;margin-top:2px;padding-top:3px}
.paper .pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.paper .pay>div{border:1px solid #111;border-radius:10px;padding:6px 8px}
.paper small{display:block;font-style:italic}.paper pre{font:inherit;white-space:pre-wrap;margin:0}
.sv{padding:14px 0;border-top:1px solid var(--ln)}.sv:first-of-type{border:0}
.tkr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.tkr:first-of-type{border:0}.tkr.dn .tt{text-decoration:line-through;color:var(--mu)}
.tkc{width:26px;height:26px;border-radius:8px;border:2px solid var(--ln);display:grid;place-items:center;flex:none;background:var(--s)}.tkr.dn .tkc{background:var(--ok);border-color:var(--ok);color:#fff}
@media(max-width:900px){.paper .ihead{grid-template-columns:1fr}.paper .ir,.paper .ititle{text-align:left}.paper .ibox,.paper .pay{grid-template-columns:1fr}}
</style>
